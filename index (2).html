<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101114"><link rel="apple-touch-icon" href="icon.png"><title>FTMO Tracker</title><style>*{box-sizing:border-box}body{background:#101114;color:#f5f5f5;font:16px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding: max(24px,env(safe-area-inset-top)) 18px 40px}main{max-width:480px;margin:auto}h1{font-size:25px;margin-bottom:4px}small{color:#a7aab4}section{background:#1d2027;border-radius:18px;padding:18px;margin:14px 0}h2{font-size:30px;margin:10px 0}progress{width:100%;accent-color:#36c98a;height:12px}button,select{font:inherit;color:white;background:#30343e;border:0;border-radius:12px;padding:14px;width:100%;margin:5px 0}button{cursor:pointer}.row{display:flex;gap:10px}.row>*{flex:1}.win{background:#137b50}.loss{background:#a82e3d}.big{font-size:22px;padding:24px 8px}p{margin:8px 0}.entry{padding:10px 0;border-bottom:1px solid #353842}.green{color:#55dba1}.red{color:#ff8585}input{width:100%;padding:12px;background:#30343e;color:white;border:1px solid #555;border-radius:8px;font:inherit;margin:5px 0 12px}label{display:block}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 3px;border-bottom:1px solid #353842;text-align:right}td:first-child,th:first-child{text-align:left}.stop{border:2px solid #ff6565;background:#401e26;padding:14px;border-radius:12px;margin:12px 0}.warn{color:#ffd17a}.safe{color:#55dba1}</style></head><body><main><h1>FTMO TRACKER</h1><small>PERSOONLIJKE TRACKER · USD · V7</small><button onclick="setup()">Instellingen</button><form id="setup" hidden></form><section id="personal"></section><section id="daily"></section><div id="accounts"></div><select id="mode" aria-label="Account"><option value="both">Beide accounts</option><option value="a">Account A</option><option value="b">Account B</option></select><div class="row"><button class="win big" onclick="trade(1)">＋ WIN</button><button class="loss big" onclick="trade(-1)">− LOSS</button></div><section><b>Handmatig resultaat (USD)</b><label>Account<select id="manualAccount"><option value="a">Account A</option><option value="b">Account B</option></select></label><input id="amount" type="number" step="any" placeholder="Bijv. -250 of 1200"><button onclick="manual()">Resultaat toevoegen</button></section><section id="limits"></section><section id="scenarios"></section><section id="stats"></section><button onclick="undo()">Laatste trade ongedaan maken</button><section><b>Tradegeschiedenis</b><div id="history"></div></section><button onclick="backup()">Exporteer backup</button><small>Simulatie zonder commissies, slippage of floating drawdown. Controleer FTMO-regels afzonderlijk.</small></main><script>const key='tracker-history-v2';let h=[];try{h=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(h))h=[]}catch{}let cfg;try{cfg=JSON.parse(localStorage.getItem('tracker-settings-v2')||'null')}catch{}if(!cfg)cfg=null;function setup(){let f=document.getElementById('setup');f.hidden=false;f.innerHTML='<h3>Accountinstellingen</h3>'+['a','b'].map(k=>'<h4>Account '+k.toUpperCase()+'</h4>'+[['base','Oorspronkelijke grootte'],['start','Startbalans'],['target','Doelbalans'],['risk','Risico'],['rr','RR'],['floor','Minimumbalans']].map(([n,l])=>`<label>${l}<input required type="number" step="any" min="0.01" name="${k}_${n}" value="${cfg?.[k]?.[n]??''}"></label>`).join('')).join('')+'<button>Opslaan</button>';f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),next={};for(let k of ['a','b']){next[k]={name:k.toUpperCase()};for(let n of ['base','start','target','risk','rr','floor'])next[k][n]=Number(d.get(k+'_'+n));if(next[k].floor>=next[k].start||next[k].target<=next[k].base){alert('Controleer balans, minimum en doel');return}}cfg=next;localStorage.setItem('tracker-settings-v2',JSON.stringify(cfg));f.hidden=true;render()}}const usd=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});function bal(k){return cfg[k].start+h.reduce((s,t)=>s+(t[k]||0),0)}function save(){try{localStorage.setItem(key,JSON.stringify(h))}catch{alert('Opslag niet beschikbaar. Exporteer je backup.')}render()}function trade(d){if(!cfg){setup();return}let m=document.getElementById('mode').value,t={date:new Date().toISOString(),d};for(let k of ['a','b'])if(m==='both'||m===k){if(bal(k)>=cfg[k].target||bal(k)<=cfg[k].floor)continue;t[k]=cfg[k].risk*(d===1?cfg[k].rr:-1)}if(!t.a&&!t.b){alert('Geen actief account geselecteerd.');return}if(['a','b'].some(k=>t[k]&&(personal(k).hit||personal(k).unsafe))&&!confirm('STOP TRADING: persoonlijke daglimiet bereikt of volgende trade te riskant. Alleen bevestigen om een reeds uitgevoerde trade te registreren.'))return;h.push(t);save()}function undo(){if(h.length&&confirm('Laatste trade verwijderen?')){h.pop();save()}}function manual(){if(!cfg){setup();return}let k=document.getElementById('manualAccount').value,v=Number(document.getElementById('amount').value);if(!Number.isFinite(v)||!v)return;h.push({date:new Date().toISOString(),d:v>0?1:-1,[k]:v});document.getElementById('amount').value='';save()}function day(t){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t))}function personal(k){let c=cfg[k],today=day(Date.now()),net=0,hit=false,cap=c.base*.02;for(let t of h){if(day(t.date)!==today)continue;net+=t[k]||0;if(net<=-cap)hit=true}return {net,hit,room:Math.max(0,cap+net),cap,unsafe:net-c.risk<=-cap}}function riskPanel(){document.getElementById('personal').innerHTML='<b>STOP TRADING · Persoonlijke daglimiet 2%</b>'+['a','b'].map(k=>{let r=personal(k),stop=r.hit||r.unsafe;return `<div class="${stop?'stop':'entry'}"><b>Account ${k.toUpperCase()} · <span class="${stop?'red':'safe'}">${stop?'STOP TRADING':'Binnen limiet'}</span></b><p>Dagresultaat: ${usd(r.net)} · Limiet: ${usd(r.cap)}</p><progress max="100" value="${Math.min(100,Math.max(0,-r.net/r.cap*100))}"></progress><p>Dagverlies: ${Math.max(0,-r.net/cfg[k].base*100).toFixed(2)}% / 2%</p><p>Resterende ruimte: ${usd(r.room)}</p><p>Volledige losses vóór limiet: ${r.hit?0:Math.max(0,Math.ceil(r.room/cfg[k].risk)-1)}</p>${stop?'<small>'+ (r.hit?'Daglimiet bereikt. Stop voor vandaag.':'Volgende volledige loss raakt of overschrijdt de limiet. Geen nieuwe trade met dit risico.')+'</small>':''}</div>`}).join('')+'<small>Reset om middernacht in Praag. Alleen ingevoerde resultaten; geen live MT5-blokkade. Registreer ook trades die ondanks de waarschuwing zijn uitgevoerd.</small>'}function limits(){let today=day(Date.now());let vals=['a','b'].map(k=>{let c=cfg[k],b=bal(k),daily=h.filter(t=>day(t.date)===today).reduce((s,t)=>s+(t[k]||0),0),room=Math.max(0,c.base*.05+daily),total=Math.max(0,b-c.floor),count=x=>Math.max(0,Math.ceil(x/c.risk)-1);return [Math.ceil(Math.max(0,c.target-b)/(c.risk*c.rr)),usd(daily),usd(room),count(Math.min(room,total)),usd(total),count(total)]});document.getElementById('limits').innerHTML='<b>Risicotabel</b><table><tr><th>Statistiek</th><th>A</th><th>B</th></tr>'+['Wins tot doel','Dagresultaat','Dagruimte (5%)','Losses vandaag','Totale ruimte','Losses totaal'].map((l,i)=>`<tr><td>${l}</td><td>${vals[0][i]}</td><td>${vals[1][i]}</td></tr>`).join('')+'</table><small>Schatting op basis van ingevoerde gesloten trades; dagreset Praag. Geen floating P/L of kosten tenzij ingevoerd. Blijf onder de limieten.</small>'}function scenarios(){document.getElementById('scenarios').innerHTML='<b>Verliesscenario’s</b><small style="display:block;margin:8px 0">Extra opeenvolgende losses vanaf je actuele balans, gevolgd door wins. Exclusief kosten; daglimiet geldt apart.</small>'+['a','b'].map(k=>{let c=cfg[k];return '<h3>Account '+k.toUpperCase()+'</h3><table><tr><th>Losses</th><th>Balans</th><th>Wins nodig</th></tr>'+Array.from({length:11},(_,i)=>{let b=bal(k)-i*c.risk;return `<tr><td>${i}</td><td>${usd(b)}</td><td>${b<=c.floor?'Limiet':Math.ceil(Math.max(0,c.target-b)/(c.risk*c.rr))}</td></tr>`}).join('')+'</table>'}).join('')}function dailyPanel(){let today=day(Date.now()),trades=h.filter(t=>day(t.date)===today);let rows=['a','b'].map(k=>{let v=trades.map(t=>Number(t[k])||0);let win=v.reduce((s,n)=>s+Math.max(0,n),0),loss=v.reduce((s,n)=>s+Math.max(0,-n),0);return {win,loss,net:win-loss}});let win=rows.reduce((s,r)=>s+r.win,0),loss=rows.reduce((s,r)=>s+r.loss,0),w=trades.filter(t=>t.d===1).length,l=trades.filter(t=>t.d===-1).length;document.getElementById('daily').innerHTML=`<b>Vandaag · dagresultaat</b><div class="row"><div><p><small>Totale winst</small></p><b class="green">+${usd(win)}</b></div><div><p><small>Totaal verlies</small></p><b class="red">−${usd(loss)}</b></div></div><p><small>Netto dagresultaat</small></p><h2 class="${win-loss>=0?'green':'red'}">${usd(win-loss)}</h2><table><tr><th>Account</th><th>Winst</th><th>Verlies</th><th>Netto</th></tr>${rows.map((r,i)=>`<tr><td>${i?'B':'A'}</td><td class="green">${usd(r.win)}</td><td class="red">−${usd(r.loss)}</td><td>${usd(r.net)}</td></tr>`).join('')}</table><p><small>${w} wins · ${l} losses · ${w+l?(100*w/(w+l)).toFixed(1):0}% winrate vandaag</small></p><small>Ingevoerde gesloten trades · reset middernacht Praag</small>`}function render(){if(!cfg){setup();return}dailyPanel();riskPanel();limits();scenarios();document.getElementById('accounts').innerHTML=Object.entries(cfg).map(([k,c])=>{let b=bal(k),p=(b-c.base)/(c.target-c.base)*100;return `<section><small>ACCOUNT ${c.name}</small><h2>${usd(b)}</h2><progress max="100" value="${Math.max(0,Math.min(100,p))}"></progress><p>Doel: ${usd(c.target)} · ${p.toFixed(2)}%</p><p>Nog nodig: ${usd(Math.max(0,c.target-b))}</p><small>WIN ${usd(c.risk*c.rr)} · LOSS ${usd(c.risk)}<br>Ruimte tot minimum: ${usd(b-c.floor)}</small>${b>=c.target?'<p class="green">Winstdoel bereikt — account gepauzeerd</p>':''}</section>`}).join('');let w=h.filter(t=>t.d===1).length;document.getElementById('stats').textContent=`Wins: ${w} · Losses: ${h.length-w} · Winrate: ${h.length?(100*w/h.length).toFixed(1):0}%`;document.getElementById('history').innerHTML=h.slice().reverse().map(t=>`<div class="entry ${t.d===1?'green':'red'}">${t.d===1?'WIN':'LOSS'} · ${t.a?'A '+usd(t.a):''} ${t.b?'B '+usd(t.b):''}<br><small>${new Date(t.date).toLocaleString('nl-NL')}</small></div>`).join('')||'<p><small>Nog geen trades</small></p>'}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg,history:h},null,2)],{type:'application/json'}));a.download='ftmo-backup.json';a.click()}render();setInterval(()=>{if(cfg){dailyPanel();riskPanel();limits()}},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden&&cfg)render()});</script></body></html>
