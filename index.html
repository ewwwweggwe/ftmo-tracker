<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101114"><link rel="apple-touch-icon" href="icon.png"><title>FTMO Tracker</title><style>*{box-sizing:border-box}body{background:#101114;color:#f5f5f5;font:16px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding: max(24px,env(safe-area-inset-top)) 18px 40px}main{max-width:480px;margin:auto}h1{font-size:25px;margin-bottom:4px}small{color:#a7aab4}section{background:#1d2027;border-radius:18px;padding:18px;margin:14px 0}h2{font-size:30px;margin:10px 0}progress{width:100%;accent-color:#36c98a;height:12px}button,select{font:inherit;color:white;background:#30343e;border:0;border-radius:12px;padding:14px;width:100%;margin:5px 0}button{cursor:pointer}.row{display:flex;gap:10px}.row>*{flex:1}.win{background:#137b50}.loss{background:#a82e3d}.big{font-size:22px;padding:24px 8px}p{margin:8px 0}.entry{padding:10px 0;border-bottom:1px solid #353842}.green{color:#55dba1}.red{color:#ff8585}</style></head><body><main><h1>FTMO TRACKER</h1><small>PERSOONLIJKE TRACKER · USD</small><div id="accounts"></div><select id="mode" aria-label="Account"><option value="both">Beide accounts</option><option value="a">Account A</option><option value="b">Account B</option></select><div class="row"><button class="win big" onclick="trade(1)">＋ WIN</button><button class="loss big" onclick="trade(-1)">− LOSS</button></div><section id="stats"></section><button onclick="undo()">Laatste trade ongedaan maken</button><section><b>Tradegeschiedenis</b><div id="history"></div></section><button onclick="backup()">Exporteer backup</button><small>Simulatie zonder commissies, slippage of floating drawdown. Controleer FTMO-regels afzonderlijk.</small></main><script>const key='tracker-history-v2';let h=[];try{h=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(h))h=[]}catch{}let cfg;try{cfg=JSON.parse(localStorage.getItem('tracker-settings-v2')||'null')}catch{}if(!cfg){cfg={};for(const k of ['a','b']){let c={name:k.toUpperCase()};for(const [field,label] of [['base','Oorspronkelijke accountgrootte'],['start','Huidige balans'],['target','Winstdoel als balans'],['risk','Risico per trade'],['rr','Risk reward'],['floor','Minimale balans']]){let v;do{let raw=prompt('Account '+k.toUpperCase()+' — '+label+' (USD, punt als decimaal)');if(raw===null){document.body.textContent='Herlaad de pagina om de instellingen in te vullen.';throw Error('Setup cancelled')}v=Number(raw.replace(',','.'))}while(!Number.isFinite(v)||v<=0);c[field]=v}cfg[k]=c}localStorage.setItem('tracker-settings-v2',JSON.stringify(cfg))}const usd=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});function bal(k){return cfg[k].start+h.reduce((s,t)=>s+(t[k]||0),0)}function save(){try{localStorage.setItem(key,JSON.stringify(h))}catch{alert('Opslag niet beschikbaar. Exporteer je backup.')}render()}function trade(d){let m=document.getElementById('mode').value,t={date:new Date().toISOString(),d};for(let k of ['a','b'])if(m==='both'||m===k){if(bal(k)>=cfg[k].target||bal(k)<=cfg[k].floor)continue;t[k]=cfg[k].risk*(d===1?cfg[k].rr:-1)}if(!t.a&&!t.b){alert('Geen actief account geselecteerd.');return}h.push(t);save()}function undo(){if(h.length&&confirm('Laatste trade verwijderen?')){h.pop();save()}}function render(){document.getElementById('accounts').innerHTML=Object.entries(cfg).map(([k,c])=>{let b=bal(k),p=(b-c.base)/(c.target-c.base)*100;return `<section><small>ACCOUNT ${c.name}</small><h2>${usd(b)}</h2><progress max="100" value="${Math.max(0,Math.min(100,p))}"></progress><p>Doel: ${usd(c.target)} · ${p.toFixed(2)}%</p><p>Nog nodig: ${usd(Math.max(0,c.target-b))}</p><small>WIN ${usd(c.risk*c.rr)} · LOSS ${usd(c.risk)}<br>Ruimte tot minimum: ${usd(b-c.floor)}</small>${b>=c.target?'<p class="green">Winstdoel bereikt — account gepauzeerd</p>':''}</section>`}).join('');let w=h.filter(t=>t.d===1).length;document.getElementById('stats').textContent=`Wins: ${w} · Losses: ${h.length-w} · Winrate: ${h.length?(100*w/h.length).toFixed(1):0}%`;document.getElementById('history').innerHTML=h.slice().reverse().map(t=>`<div class="entry ${t.d===1?'green':'red'}">${t.d===1?'WIN':'LOSS'} · ${t.a?'A '+usd(t.a):''} ${t.b?'B '+usd(t.b):''}<br><small>${new Date(t.date).toLocaleString('nl-NL')}</small></div>`).join('')||'<p><small>Nog geen trades</small></p>'}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg,history:h},null,2)],{type:'application/json'}));a.download='ftmo-backup.json';a.click()}render();</script></body></html>
